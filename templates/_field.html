<div class="field{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label|capfirst }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
