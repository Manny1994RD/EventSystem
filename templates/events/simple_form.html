{% extends "base.html" %}{% load i18n %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card">{% csrf_token %}
  {% for e in form.non_field_errors %}<div class="msg error">{{ e }}</div>{% endfor %}
  {% for field in form %}{% include "_field.html" %}{% endfor %}
  <div class="row"><button class="btn">{% translate "Save" %}</button><a class="btn ghost" href="{% url 'events:settings' %}">{% translate "Back" %}</a></div>
</form>
{% endblock %}
