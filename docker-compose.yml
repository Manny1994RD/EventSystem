services:
  app:
    build: .
    image: church-events:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Database, flyers and backups live here on the Zima server.
      - ${DATA_PATH:-./data}:/data

  scheduler:
    image: church-events:latest
    restart: unless-stopped
    env_file: .env
    depends_on: [app]
    volumes:
      - ${DATA_PATH:-./data}:/data
    entrypoint: ["/bin/sh", "-c"]
    # Once a day: a backup (keeping the last 14) and the email reminders (they do nothing while email is off).
    command: ["sleep 60; while true; do python manage.py backup --keep 14; python manage.py send_reminders; sleep 86400; done"]
